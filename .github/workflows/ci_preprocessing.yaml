name: Continuous Integration - Preprocessing
run-name: "${{ github.workflow }}"

on:
  workflow_call:

permissions:
  contents: write
  packages: write

env:
  PREPROCESSING_REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/cisuc-preprocessing
  CHROMADB_REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/cisuc-chromadb

jobs:
  preprocessing:
    runs-on: self-hosted
    timeout-minutes: 120

    env:
      CISUC_TOKEN: ${{ secrets.CISUC_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OLLAMA_URL: ${{ secrets.OLLAMA_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install DVC
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          if ! command -v dvc >/dev/null 2>&1; then
            python3 -m pip install --user dvc
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify DVC
        run: |
          which dvc
          dvc --version

      - name: Configure DVC remote
        run: |
          dvc remote add --local --force -d preprocessing-cache \
            /home/dev/dvc-storage/cisuc-chatbot

      - name: Restore preprocessing data
        run: |
          if ! dvc pull; then
            echo "No reusable DVC output found; preprocessing will run."
          fi

      - name: Load configuration
        shell: bash
        run: |
          set -a

          source config/chatbot-common.env
          source config/preprocessing.env

          set +a

          {
            echo "PREPROCESSING_IMAGE=$PREPROCESSING_IMAGE"
            echo "CHROMADB_FINAL_IMAGE=$CHROMADB_FINAL_IMAGE"
          } >> "$GITHUB_ENV"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Configure runner identity
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Prepare preprocessing workspace
        shell: bash
        run: |
          mkdir -p \
            .local/raw \
            .local/enriched \
            .local/chroma

          dvc unprotect \
            .local/raw \
            .local/enriched \
            .local/chroma

          chmod -R u+rwX,g+rwX .local
      - name: Check workspace before Docker
        run: |
          pwd
          find .local -maxdepth 2 -printf "%P\n"

      - name: Build preprocessing image
        run: |
          ./scripts/build-preprocessing.sh

      - name: Diagnose Chroma mount
        shell: bash
        run: |
          docker compose \
            -f preprocessing/docker-compose.yaml \
            exec -T chromadb sh -c '
              echo "=== mount ==="
              mount | grep " /data " || true

              echo "=== df ==="
              df -h /data || true

              echo "=== stat ==="
              stat /data || true

              echo "=== ls ==="
              ls -la /data || true

              echo "=== touch ==="
              touch /data/test && echo OK || echo FAIL
            '

      - name: Check workspace after Docker
        run: |
          find .local -maxdepth 2 -printf "%P\n"

      - name: Inspect host workspace
        shell: bash
        run: |
          set -euxo pipefail

          pwd

          ls -ld .local .local/chroma
          ls -la .local/chroma || true

          stat .local
          stat .local/chroma

          find .local -maxdepth 2 \
            -printf "%M %u:%g %p\n"

      - name: Inspect Docker mount
        shell: bash
        run: |
          set -euxo pipefail

          docker compose \
            -f preprocessing/docker-compose.yaml \
            ps

          docker inspect preprocessing-chromadb-1 \
            --format '{{json .Mounts}}'

      - name: Test write inside Chroma container
        shell: bash
        run: |
          set -euxo pipefail

          docker compose \
            -f preprocessing/docker-compose.yaml \
            exec -T chromadb sh -c '
              echo "== id =="
              id

              echo "== /data =="
              ls -ld /data

              echo "== contents =="
              find /data -maxdepth 2 \
                -printf "%M %u:%g %p\n"

              echo "== write test =="
              touch /data/test-write
              echo ok >/data/test-write
              cat /data/test-write
              rm /data/test-write
            '

      - name: Inspect SQLite files
        shell: bash
        run: |
          docker compose \
            -f preprocessing/docker-compose.yaml \
            exec -T chromadb sh -c '
              find /data \
                -type f \
                -printf "%M %u:%g %p\n"
            '

      - name: Check preprocessing status
        id: dvc-status
        shell: bash
        run: |
          set -euo pipefail

          status_output="$(dvc status preprocessing)"
          printf '%s\n' "$status_output"

          if [[ "$status_output" == "Data and pipelines are up to date." ]]; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check workspace before repro
        run: |
          find .local -maxdepth 2 -printf "%P\n"

      - name: Inspect Chroma DB before repro
        run: |
          ls -l .local/chroma
          stat .local/chroma/chroma.sqlite3

      - name: Diagnose before repro
        run: |
          echo "Host:"
          stat .local/chroma
          ls -la .local/chroma

          docker compose \
            -f preprocessing/docker-compose.yaml \
            exec -T chromadb \
            stat /data

          docker compose \
            -f preprocessing/docker-compose.yaml \
            exec -T chromadb \
            ls -la /data

      - name: Reproduce preprocessing data
        run: |
          dvc repro preprocessing

      - name: Report preprocessing result
        run: |
          if [[ "${{ steps.dvc-status.outputs.reused }}" == "true" ]]; then
            echo "✅ Reused cached preprocessing output."
          else
            echo "🔄 Regenerated preprocessing output."
          fi

      - name: Store preprocessing data
        run: |
          dvc push

      - name: Finalize preprocessing image
        run: |
          ./scripts/finish-preprocessing.sh

      - name: Commit updated DVC lock
        if: |
          github.event_name == 'push' &&
          github.ref != 'refs/heads/develop' &&
          github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- dvc.lock; then
            echo "dvc.lock did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dvc.lock
          git commit -m "chore: update preprocessing DVC lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # No tag or push occurs before this point.
      # Reaching this step means preprocessing succeeded or valid DVC output was reused.

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag branch and commit images
        run: |
          docker tag \
            "$PREPROCESSING_IMAGE" \
            "$PREPROCESSING_REGISTRY_IMAGE:${GITHUB_SHA}"

          docker tag \
            "$CHROMADB_FINAL_IMAGE" \
            "$CHROMADB_REGISTRY_IMAGE:${GITHUB_SHA}"

          docker tag \
            "$PREPROCESSING_IMAGE" \
            "$PREPROCESSING_REGISTRY_IMAGE:${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}"

          docker tag \
            "$CHROMADB_FINAL_IMAGE" \
            "$CHROMADB_REGISTRY_IMAGE:${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}"

      - name: Push branch and commit images
        run: |
          docker push "$PREPROCESSING_REGISTRY_IMAGE:${GITHUB_SHA}"
          docker push "$CHROMADB_REGISTRY_IMAGE:${GITHUB_SHA}"

          docker push \
            "$PREPROCESSING_REGISTRY_IMAGE:${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}"

          docker push \
            "$CHROMADB_REGISTRY_IMAGE:${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}"

      - name: Show Compose logs after failure
        if: failure()
        run: |
          docker compose \
            -f preprocessing/docker-compose.yaml \
            logs --no-color || true

      - name: Inspect Chroma DB after failure
        if: failure()
        run: |
          ls -l .local/chroma || true
          stat .local/chroma/chroma.sqlite3 || true

      - name: Clean up
        if: always()
        run: |
          docker compose \
            -f preprocessing/docker-compose.yaml \
            down -v --remove-orphans || true

          rm -rf .local