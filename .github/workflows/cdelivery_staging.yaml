name: Continuous Delivery - Development
run-name: "${{ github.workflow }}"

on:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-development
  cancel-in-progress: true

env:
  CHROMADB_REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/cisuc-chromadb
  RAG_REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/cisuc-rag
  ORCHESTRATOR_REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/cisuc-orchestrator
  GUI_REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/cisuc-gui

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    env:
      BUILD_SHA: ${{ github.sha }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}.git

      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OLLAMA_URL: ${{ secrets.OLLAMA_URL }}

      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$DEV_SSH_PRIVATE_KEY" \
            | tr -d '\r' \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keyscan -H "$DEV_HOST" \
            >> "$HOME/.ssh/known_hosts"

          ssh-keygen -y \
            -f "$HOME/.ssh/id_ed25519" \
            >/dev/null

      - name: Encode deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "OPENAI_API_KEY_B64=$(printf '%s' "$OPENAI_API_KEY" | base64 | tr -d '\n')"
            echo "OLLAMA_URL_B64=$(printf '%s' "$OLLAMA_URL" | base64 | tr -d '\n')"
            echo "GHCR_TOKEN_B64=$(printf '%s' "$GHCR_TOKEN" | base64 | tr -d '\n')"
          } >> "$GITHUB_ENV"

      - name: Deploy development environment
        shell: bash
        run: |
          set -euo pipefail

          ssh "$DEV_USER@$DEV_HOST" \
            "BUILD_SHA='$BUILD_SHA' \
             REPOSITORY_URL='$REPOSITORY_URL' \
             CHROMADB_REGISTRY_IMAGE='$CHROMADB_REGISTRY_IMAGE' \
             RAG_REGISTRY_IMAGE='$RAG_REGISTRY_IMAGE' \
             ORCHESTRATOR_REGISTRY_IMAGE='$ORCHESTRATOR_REGISTRY_IMAGE' \
             GUI_REGISTRY_IMAGE='$GUI_REGISTRY_IMAGE' \
             GHCR_USERNAME='$GHCR_USERNAME' \
             GHCR_TOKEN_B64='$GHCR_TOKEN_B64' \
             OPENAI_API_KEY_B64='$OPENAI_API_KEY_B64' \
             OLLAMA_URL_B64='$OLLAMA_URL_B64' \
             bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          DEPLOY_DIR="$HOME/CISUC_chatbot"

          if [[ ! -d "$DEPLOY_DIR/.git" ]]; then
            echo "Repository not found. Cloning..."
            rm -rf "$DEPLOY_DIR"
            git clone "$REPOSITORY_URL" "$DEPLOY_DIR"
          fi

          cd "$DEPLOY_DIR"

          echo "Checking out development commit: $BUILD_SHA"

          git fetch --prune origin
          git checkout -B develop "$BUILD_SHA"
          git reset --hard "$BUILD_SHA"
          git clean -fd

          GHCR_TOKEN="$(
            printf '%s' "$GHCR_TOKEN_B64" |
              base64 --decode
          )"

          OPENAI_API_KEY="$(
            printf '%s' "$OPENAI_API_KEY_B64" |
              base64 --decode
          )"

          OLLAMA_URL="$(
            printf '%s' "$OLLAMA_URL_B64" |
              base64 --decode
          )"

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

          export CHROMADB_FINAL_IMAGE="${CHROMADB_REGISTRY_IMAGE}:${BUILD_SHA}"
          export RAG_IMAGE="${RAG_REGISTRY_IMAGE}:${BUILD_SHA}"
          export ORCHESTRATOR_IMAGE="${ORCHESTRATOR_REGISTRY_IMAGE}:${BUILD_SHA}"
          export GUI_IMAGE="${GUI_REGISTRY_IMAGE}:${BUILD_SHA}"

          export OPENAI_API_KEY
          export OLLAMA_URL

          export COMPOSE_PROJECT_NAME="chatbot-development"

          chmod +x scripts/*.sh

          echo "Deploying development commit: $BUILD_SHA"

          ./scripts/run-application.sh up application/docker-compose.deployment.yaml

          docker image prune -f
          REMOTE_SCRIPT