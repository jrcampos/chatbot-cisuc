name: Continuous Delivery - Preview Cleanup
run-name: "${{ github.workflow }}"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: self-hosted
    timeout-minutes: 10

    env:
      PREVIEW_ID: ${{ github.event.pull_request.number }}
      COMPOSE_PROJECT_NAME: pr${{ github.event.pull_request.number }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Capture preview images
        shell: bash
        run: |
          docker ps -a \
            --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" \
            --format '{{.ID}}' \
            | xargs -r docker inspect --format '{{.Image}}' \
            | sort -u > /tmp/preview-images.txt

      - name: Remove preview
        run: |
          ./scripts/run-application.sh \
            down \
            application/docker-compose.preview.yaml

      - name: Remove preview images
        shell: bash
        run: |
          if [[ -f /tmp/preview-images.txt ]]; then
            while IFS= read -r image; do
              [[ -n "$image" ]] && docker image rm "$image" || true
            done < /tmp/preview-images.txt
          fi
