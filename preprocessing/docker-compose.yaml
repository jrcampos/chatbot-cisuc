services:
  preprocessing:
    image: ${PREPROCESSING_IMAGE:?PREPROCESSING_IMAGE must be defined}
    build:
      context: .
      dockerfile: Dockerfile
    user: "${HOST_UID}:${HOST_GID}"
    command: ["sleep", "infinity"]
    volumes:
      - ../.local:/workspace
    environment:
      WORKSPACE: /workspace
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    depends_on:
      - chromadb
    networks:
      - preprocessing

  chromadb:
    image: chromadb/chroma:1.5.9
    environment:
      CHROMA_PERSIST_PATH: /chroma-image-data
    networks:
      - preprocessing

networks:
  preprocessing: