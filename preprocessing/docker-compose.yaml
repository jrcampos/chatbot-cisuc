services:
  preprocessing:
    image: ${PREPROCESSING_IMAGE:?PREPROCESSING_IMAGE must be defined}
    build:
      context: .
      dockerfile: Dockerfile
    user: "${HOST_UID}:${HOST_GID}"
    command: ["sleep", "infinity"]
    volumes:
      - ../.local:/workspace
    environment:
      WORKSPACE: /workspace
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    depends_on:
      - chromadb
    networks:
      - preprocessing

  chromadb:
    image: chromadb/chroma:1.5.9
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - ../.local:/data
    environment:
      CHROMA_PERSIST_PATH: /data/chroma
    networks:
      - preprocessing

  chromadb-final:
    image: ${CHROMADB_FINAL_IMAGE}
    build:
      context: ..
      dockerfile: preprocessing/Dockerfile.chromadb

networks:
  preprocessing: