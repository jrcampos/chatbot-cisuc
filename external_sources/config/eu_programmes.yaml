# F&T Portal status facet values (type=1 is "grants" — the only type this
# plugin queries; type=2 is tenders/external-action, out of scope here).
status_codes:
  forthcoming: "31094501"
  open: "31094502"
  closed: "31094503"

# Per-call detail endpoint (same platform the portal's own pages call). The portal
# serves lowercase identifiers only. The payload is consumed whole: keys the search
# payload lacks are injected in search shape, the rest is reduced to a few extras.
detail:
  url_template: "https://ec.europa.eu/info/funding-tenders/opportunities/data/topicDetails/{identifier_lower}.json"
  root_key: TopicDetails
