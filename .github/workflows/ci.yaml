name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PREPROCESSING_LOCAL_IMAGE: cisuc-preprocessing:local
  CHROMADB_LOCAL_IMAGE: cisuc-chromadb:local

  PREPROCESSING_REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/cisuc-preprocessing
  CHROMADB_REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/cisuc-chromadb

jobs:
  preprocessing:
    name: Build preprocessing images

    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CISUC_TOKEN: ${{ secrets.CISUC_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      MODEL_EMBEDDINGS: ${{ vars.MODEL_EMBEDDINGS }}
      LLM_URL: ${{ vars.LLM_URL }}

      ENHANCEMENT_MODEL: ${{ vars.ENHANCEMENT_MODEL }}
      ENHANCEMENT_MAX_WORKERS: ${{ vars.ENHANCEMENT_MAX_WORKERS }}

      CHROMA_COLLECTION: ${{ vars.CHROMA_COLLECTION }}

      PREPROCESSING_IMAGE: ${{ env.PREPROCESSING_LOCAL_IMAGE }}
      CHROMADB_FINAL_IMAGE: ${{ env.CHROMADB_LOCAL_IMAGE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Create local workspace
        run: |
          mkdir -p \
            .local/raw \
            .local/enriched \
            .local/chroma

      - name: Run limited preprocessing canary
        run: |
          ./scripts/run-full-processing.sh --limit 3

      - name: Remove canary environment and data
        run: |
          docker compose \
            -f preprocessing/docker-compose.yaml \
            down --remove-orphans

          docker image rm "$CHROMADB_LOCAL_IMAGE" 2>/dev/null || true

          rm -rf .local
          mkdir -p .local/raw .local/enriched .local/chroma

      - name: Run full preprocessing
        run: |
          ./scripts/run-full-processing.sh

      # No tag or push occurs before this point.
      # Reaching this step means both preprocessing runs succeeded.

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag branch and commit images
        run: |
          docker tag \
            "$PREPROCESSING_LOCAL_IMAGE" \
            "$PREPROCESSING_REGISTRY_IMAGE:${GITHUB_SHA}"

          docker tag \
            "$CHROMADB_LOCAL_IMAGE" \
            "$CHROMADB_REGISTRY_IMAGE:${GITHUB_SHA}"

          docker tag \
            "$PREPROCESSING_LOCAL_IMAGE" \
            "$PREPROCESSING_REGISTRY_IMAGE:${GITHUB_REF_NAME}-${GITHUB_SHA:0:7}"
          
          docker tag \
            "$CHROMADB_LOCAL_IMAGE" \
            "$CHROMADB_REGISTRY_IMAGE:${GITHUB_REF_NAME}-${GITHUB_SHA:0:7}"

      - name: Push branch and commit images
        run: |
          docker push "$PREPROCESSING_REGISTRY_IMAGE:${GITHUB_SHA}"
          docker push "$CHROMADB_REGISTRY_IMAGE:${GITHUB_SHA}"

          docker push "$PREPROCESSING_REGISTRY_IMAGE:${GITHUB_REF_NAME}-${GITHUB_SHA:0:7}"
          docker push "$CHROMADB_REGISTRY_IMAGE:${GITHUB_REF_NAME}-${GITHUB_SHA:0:7}"

      - name: Show Compose logs after failure
        if: failure()
        run: |
          docker compose \
            -f preprocessing/docker-compose.yaml \
            logs --no-color || true

      - name: Clean up
        if: always()
        run: |
          docker compose \
            -f preprocessing/docker-compose.yaml \
            down --remove-orphans || true