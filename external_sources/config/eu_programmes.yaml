# EU Funding & Tenders Portal programme IDs.
# Source: the portal's own internal `frameworkProgramme` facet values,
# extracted from the pipeworx-io/mcp-eu-funding-tenders client (MIT-licensed,
# https://github.com/pipeworx-io/mcp-eu-funding-tenders) and independently
# verified live against the real API during research (2026-09).
#
# This file is what makes the ft_portal plugin institution/config-driven
# rather than hardcoded — add or remove a programme here, not in the plugin.
