services:
  gui:
    ports: !reset []
    networks:
      - chatbot_net

  orchestrator:
    # Mantém a 8002 publicada (avaliação RAGAS, scripts no host); o proxy continua a servir a GUI e /chat na 80
    ports:
      - "${ORCHESTRATOR_HOST_PORT:?ORCHESTRATOR_HOST_PORT must be defined}:8002"
    networks:
      - chatbot_net

  development_proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./development-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gui
      - orchestrator
    networks:
      - chatbot_net
    restart: unless-stopped

networks:
  chatbot_net: